<title>ACE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: #home is one screen: the pixel mascot beside a big pixel wordmark and a terminal-style prompt, with a pixel tide along the bottom.
   #chat is the studio: project rail | chat | workspace (file tabs + editor, or live preview + console). Phones show one pane at a time. */
:root {
  --bg: #eef4fb;
  --panel: #ffffff;
  --rail: #e2ebf6;
  --fg: #0b1b33;
  --muted: #4a5f7e;
  --line: #cbd9ea;
  --line-strong: #9fb6d3;
  --accent: #1766d6;
  --accent-ink: #ffffff;
  --accent-soft: #d8e7fb;
  --user-bubble: #0b1b33;
  --user-ink: #eef4fb;
  --code-bg: #f6f9fd;
  --frame-bg: #ffffff;
  --danger: #b3261e;
  --warn: #9a6100;
  --shadow: rgba(11, 27, 51, .08);
  --px-line: #0b2a55; --px-body: #2f8cff; --px-shine: #a9d6ff; --px-eye: #06172e; --px-glint: #ffffff;
  --px-lid: #c3d0e0; --px-lid-edge: #556a87; --px-logo: #2f8cff; --px-base: #7f91aa;
  --px-screen: #8fd3ff; --px-screen-2: #d2f0ff; --px-floor: #bccde3; --checker: #e6edf6;
  --wave: #2f8cff; --wave-foam: #bfe3ff; --wave-deep: #1766d6;
  --syn-kw: #1766d6; --syn-str: #0f7b6c; --syn-num: #a14a0b; --syn-com: #7b8ba3; --syn-fn: #7a3cc7; --syn-tag: #b4304c; --syn-attr: #0e7490;
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111f; --panel: #0c1829; --rail: #091423; --fg: #e2edfb; --muted: #8ba1bf; --line: #1a2b44; --line-strong: #2d4566;
    --accent: #4ea3ff; --accent-ink: #03101f; --accent-soft: #102a4d; --user-bubble: #e2edfb; --user-ink: #07111f;
    --code-bg: #050d19; --frame-bg: #ffffff; --danger: #f2867e; --warn: #f5b73b; --shadow: rgba(0, 0, 0, .35);
    --px-line: #04122a; --px-body: #3d9bff; --px-shine: #b5e0ff; --px-eye: #04122a; --px-glint: #ffffff;
    --px-lid: #2b3f5c; --px-lid-edge: #8ba3c4; --px-logo: #5fd0ff; --px-base: #4a6080;
    --px-screen: #5fd0ff; --px-screen-2: #b0ecff; --px-floor: #1c2f4b; --checker: #12213a;
    --wave: #1f6fd6; --wave-foam: #6cc4ff; --wave-deep: #0d3f8a;
    --syn-kw: #6fb4ff; --syn-str: #5fd3b5; --syn-num: #f2b05e; --syn-com: #5e7391; --syn-fn: #c39bff; --syn-tag: #ff8fa3; --syn-attr: #5fd0e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111f; --panel: #0c1829; --rail: #091423; --fg: #e2edfb; --muted: #8ba1bf; --line: #1a2b44; --line-strong: #2d4566;
  --accent: #4ea3ff; --accent-ink: #03101f; --accent-soft: #102a4d; --user-bubble: #e2edfb; --user-ink: #07111f;
  --code-bg: #050d19; --frame-bg: #ffffff; --danger: #f2867e; --warn: #f5b73b; --shadow: rgba(0, 0, 0, .35);
  --px-line: #04122a; --px-body: #3d9bff; --px-shine: #b5e0ff; --px-eye: #04122a; --px-glint: #ffffff;
  --px-lid: #2b3f5c; --px-lid-edge: #8ba3c4; --px-logo: #5fd0ff; --px-base: #4a6080;
  --px-screen: #5fd0ff; --px-screen-2: #b0ecff; --px-floor: #1c2f4b; --checker: #12213a;
  --wave: #1f6fd6; --wave-foam: #6cc4ff; --wave-deep: #0d3f8a;
  --syn-kw: #6fb4ff; --syn-str: #5fd3b5; --syn-num: #f2b05e; --syn-com: #5e7391; --syn-fn: #c39bff; --syn-tag: #ff8fa3; --syn-attr: #5fd0e6;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; overflow-y: auto; overflow-x: hidden; }
body.view-chat { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* pixel mascot */
.mascot { display: block; image-rendering: pixelated; flex: none; overflow: hidden; }
.mascot .pD, .mascot .pr { fill: var(--px-line); } .mascot .pB, .mascot .pR { fill: var(--px-body); } .mascot .pL { fill: var(--px-shine); }
.mascot .pE, .mascot .pM { fill: var(--px-eye); } .mascot .pW { fill: var(--px-glint); }
.mascot .pG { fill: var(--px-lid-edge); } .mascot .pS { fill: var(--px-lid); } .mascot .pK { fill: var(--px-base); }
.mascot .pP { fill: var(--px-screen); } .mascot .pQ { fill: var(--px-floor); }
.mascot .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
.mascot .drop { animation: breathe 2.6s steps(1) infinite; }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
.mascot .arm { animation: type .34s steps(1) infinite; }
@keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
.mascot .screen rect { animation: flicker 2.3s steps(1) infinite; }
@keyframes flicker { 0%, 100% { fill: var(--px-screen); } 38% { fill: var(--px-screen-2); } 44% { fill: var(--px-screen); } 71% { fill: var(--px-screen-2); } 76% { fill: var(--px-screen); } }
.mascot .bit { fill: var(--px-screen); opacity: 0; animation: rise 2.4s steps(8) infinite; }
.mascot .b2 { animation-delay: .8s; } .mascot .b3 { animation-delay: 1.6s; }
@keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-2px, -8px); opacity: 0; } }
/* small copies only blink, until ACE is working */
.mascot.head .drop, .mascot.head .arm { animation: none; }
.msg.busy .mascot.head .drop { animation: breathe .5s steps(1) infinite; }

/* syntax colours (highlight.js classes) */
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-literal, .hljs-type, .hljs-meta .hljs-keyword { color: var(--syn-kw); }
.hljs-string, .hljs-regexp, .hljs-symbol, .hljs-template-tag { color: var(--syn-str); }
.hljs-number, .hljs-bullet { color: var(--syn-num); }
.hljs-comment, .hljs-quote, .hljs-doctag { color: var(--syn-com); font-style: italic; }
.hljs-title, .hljs-section, .hljs-function .hljs-title { color: var(--syn-fn); }
.hljs-name, .hljs-tag, .hljs-selector-class, .hljs-selector-id, .hljs-selector-pseudo { color: var(--syn-tag); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable.language_ { color: var(--syn-attr); }
.hljs-meta { color: var(--syn-com); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px;
  padding: 8px 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-pixel); font-weight: 700; font-size: 24px; letter-spacing: 0.04em; line-height: 1; }

/* ================= HOME ================= */
.home { min-height: 100%; display: flex; flex-direction: column; }
.home-head { display: flex; justify-content: flex-end; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.home-link { font-family: var(--font-mono); font-size: 14px; text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; }
.home-link:hover { color: var(--fg); background: var(--rail); }
.home-main { flex: 1; display: flex; align-items: center; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-grid { width: 100%; max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(28px, 6vw, 72px); align-items: center; }
.home-mascot .mascot { width: clamp(240px, 33vw, 380px); height: auto; }
.home-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.wordmark { font-family: var(--font-pixel); font-weight: 700; font-size: clamp(72px, 13vw, 148px); line-height: .82; letter-spacing: 0.03em; margin: 0; color: var(--fg); }
.ask { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line-strong); border-radius: 8px; padding: 6px 6px 6px 14px; max-width: 600px; }
.ask:focus-within { border-color: var(--accent); }
.ask .caret { font-family: var(--font-mono); font-weight: 500; font-size: 20px; color: var(--accent); line-height: 1; }
.ask input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 9px 0; font-family: var(--font-mono); font-size: 16px; }
.ask input::placeholder { color: var(--muted); opacity: .8; }
.ask-go { border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 500; font-size: 14px; border-radius: 5px; padding: 9px 14px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; max-width: 600px; }
.chips button { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.chips button:hover { color: var(--fg); border-color: var(--accent); }
.chips button.star { color: var(--accent); border-color: var(--accent); }
.tide { position: relative; overflow: hidden; flex: none; }
.waves { display: block; width: calc(100% + 64px); height: 24px; animation: drift 9s steps(16) infinite; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-64px); } }
.waves .wF { fill: var(--wave-foam); } .waves .wA { fill: var(--wave); } .waves .wQ { fill: var(--wave-deep); }
.deep { background: var(--wave-deep); height: calc(28px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 720px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .home-mascot .mascot { width: min(260px, 70vw); }
  .home-main { align-items: flex-start; padding-top: 8px; }
}
@media (max-width: 420px) { .ask-go span.k { display: none; } }

/* ================= STUDIO ================= */
.studio { display: grid; height: 100%; grid-template-columns: 228px minmax(340px, 420px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.mbar { display: none; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; flex: none; }
.seg { display: flex; background: var(--rail); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 5px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px var(--shadow); }
.seg .count { font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 5px; }

.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; padding-block: 16px; gap: 14px; }
.new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 8px 12px; font-weight: 600; }
.new-chat:hover { border-color: var(--accent); color: var(--accent); }
.rail-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; min-height: 0; flex: 1; }
.chat-item { display: flex; align-items: center; border-radius: 6px; }
.chat-item button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.chat-item:hover { background: var(--panel); }
.chat-item.active { background: var(--accent-soft); }
.chat-item .del { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 6px; opacity: 0; white-space: nowrap; }
.chat-item:hover .del, .chat-item.active .del, .chat-item .del:focus-visible { opacity: 1; }
.chat-item .del:hover { color: var(--danger); }
.empty-list { color: var(--muted); font-size: 13px; padding: 4px 2px; }
.rail-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.rail-foot button, .rail-foot a { text-align: left; background: none; border: 0; padding: 7px 4px; color: var(--muted); display: flex; gap: 8px; align-items: center; border-radius: 6px; text-decoration: none; }
.rail-foot button:hover, .rail-foot a:hover { color: var(--fg); }

.chat-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
.chat-top { display: flex; align-items: center; gap: 10px; min-height: 54px; padding-block: 10px; border-bottom: 1px solid var(--line); padding-left: 16px; padding-right: 16px; }
.chat-title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroller { flex: 1; overflow-y: auto; min-height: 0; }
.thread { max-width: 760px; margin: 0 auto; padding-block: 22px 16px; display: flex; flex-direction: column; gap: 20px; padding-left: 16px; padding-right: 16px; }

.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user { align-items: flex-end; }
.msg.user .bubble { background: var(--user-bubble); color: var(--user-ink); padding: 9px 13px; border-radius: 10px 10px 2px 10px; max-width: 90%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.msg.user .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.msg.user .thumbs .gone { font-size: 12px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; font-family: var(--font-pixel); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; color: var(--fg); }
.content { min-width: 0; overflow-wrap: anywhere; }
.content > :first-child { margin-top: 0; }
.content > :last-child { margin-bottom: 0; }
.content p { margin: 0 0 .8em; }
.content h1, .content h2, .content h3 { font-weight: 600; line-height: 1.3; margin: 1.1em 0 .45em; text-wrap: balance; }
.content h1 { font-size: 1.25em; } .content h2 { font-size: 1.14em; } .content h3 { font-size: 1.04em; }
.content ul, .content ol { padding-left: 1.3em; margin: 0 0 .8em; }
.content li { margin: .2em 0; }
.content a { color: var(--accent); }
.content code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); padding: .05em .35em; border-radius: 4px; }
.content pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .9em; }
.content pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.55; }
.content blockquote { margin: 0 0 .8em; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.content table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 .9em; font-size: 14px; }
.content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.file-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 5px 10px; margin: 2px 6px 6px 0;
  font-size: 13px; color: var(--fg); max-width: 100%; vertical-align: middle; text-align: left; }
.file-chip svg { flex: none; color: var(--accent); }
.file-chip .fp { font-family: var(--font-mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file-chip small { color: var(--muted); font-size: 12px; white-space: nowrap; font-family: var(--font-mono); }
.file-chip:hover { border-color: var(--accent); }
.file-chip.writing { border-color: var(--accent); }
.file-chip.writing small { color: var(--accent); }
.file-chip.deleted .fp { text-decoration: line-through; color: var(--muted); }
.thinking { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; font-family: var(--font-mono); font-size: 13px; }
.thinking i { width: 6px; height: 6px; background: var(--accent); animation: pulse 1.2s infinite steps(2, jump-none); }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; margin-right: 6px; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.msg-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.msg-actions button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 5px; }
.msg-actions button:hover { background: var(--rail); color: var(--fg); }
.msg-actions button.primary-act { color: var(--accent); font-weight: 600; }
.note { font-size: 13px; color: var(--danger); }

.welcome { padding-top: 2vh; display: flex; flex-direction: column; gap: 14px; }
.welcome .mascot { width: 136px; height: auto; }
.welcome h1 { font-family: var(--font-pixel); font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: 0.01em; margin: 0; }
.starters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.starters button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; }
.starters button:hover { border-color: var(--accent); }
.starters button.star { border-color: var(--accent); }
.starters b { font-weight: 600; font-size: 14px; }
.starters span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.composer-wrap { padding-block: 8px 12px; padding-left: 12px; padding-right: 12px; }
.composer { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.composer:focus-within { border-color: var(--accent); }
.attachments { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 4px 0; }
.attachments .att { position: relative; }
.attachments img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.attachments .att button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); font-size: 12px; line-height: 20px; padding: 0; }
.composer textarea { border: 0; background: none; resize: none; outline: none; padding: 6px 8px; min-height: 26px; max-height: 200px; line-height: 1.5; }
.composer-row { display: flex; align-items: center; gap: 6px; }
.icon-btn { background: none; border: 0; color: var(--muted); padding: 7px; border-radius: 6px; display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); background: var(--rail); }
.tier { border: 1px solid var(--line); background: var(--rail); border-radius: 6px; padding: 5px 8px; font-size: 13px; font-weight: 600; }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-left: auto; }
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--fg); color: var(--bg); }
.status { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

<script>
(() => {
  const DEFAULT_NAME = "ACE";
  const DEFAULT_PERSONA = "You are ACE, an AI. You're an expert programmer: you build complete, working projects, explain code clearly at any skill level, and answer general questions too. Keep a relaxed, friendly tone. Give the direct answer first and say so when you're unsure. If someone asks what you run on, you run on Claude, made by Anthropic.";
  const STARTERS = [
    ["My own code platform", "Build my own mini code platform: a browser code playground with HTML, CSS and JavaScript editor tabs, a Run button, a live preview pane, a console that shows logs and errors, and a few starter templates to pick from. Make it look professional.", true],
    ["Pixel platformer", "Make a pixel-art platformer with your own animated sprites: a hero with idle, run and jump frames, coins, two kinds of enemies, a goal flag, three levels, chiptune sound effects and touch controls for phones.", true],
    ["Snake game", "Make a Snake game with your own pixel-art sprites for the snake and food, a score, a saved high score, increasing speed, sound effects, and on-screen arrow buttons for phones."],
    ["To-do app", "Build a to-do app with categories, due dates, filters, and a dark mode toggle."],
    ["Python script", "Write a Python script that renames every photo in a folder to the date it was taken, then explain how to run it."],
    ["Explain code", "Explain this JavaScript line by line, like I'm new to coding:\n\nconst unique = [...new Set(numbers)].sort((a, b) => a - b);"],
  ];
  // No app-side caps. The only ceiling is the platform's per-message size (sample.limits().maxPromptBytes).
  let maxPromptBytes = 262144, imageMax = Infinity;
  const bytesOf = (s) => new TextEncoder().encode(s).length;
  const THINKING = '<span class="thinking"><i></i><i></i><i></i>thinking</span>';

  // ---------- pixel art: ACE (a water drop) at his laptop, and the tide ----------
  const MASCOT = [
    "................................",
    "................................",
    "................................",
    "....D...........................",
    "....DD..........................",
    ".....DBD........................",
    ".....DBBD.......................",
    "....DLBBBD......................",
    "...DLBBBBBD.....................",
    "...DLBBBWEBD................GG..",
    "..DLBBBBEEBBD...............PG..",
    "..DLBBBBEEBBBD..............PG..",
    "..DLBBBBBBBBBD..............PG..",
    ".DBBBBBBBBBBMBD............PG...",
    ".DBBBBBBBBMMBBD............PG...",
    ".DBBBBBBBBBBBBD............PG...",
    ".DBBBBBBBBBBBBD...........PG....",
    ".DBBBBBBBBBBBBDrrrr.......PG....",
    ".DBBBBBBBBBBBBRRRRRr......PG....",
    ".DBBBBBBBBBBBBDrrGKKKKKKKKKKG...",
    "..DBBBBBBBBBBD...GSSSSSSSSSSG...",
    "...DDDDDDDDDD....GGGGGGGGGGGG...",
    "QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ.",
  ];
  function pixelRects(rows, map, only, prefix) {
    let out = "";
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length;) {
        const ch = map(row[x]);
        if (!ch || (only && !only.includes(ch))) { x++; continue; }
        let w = 1;
        while (x + w < row.length && map(row[x + w]) === ch) w++;
        out += `<rect class="${prefix}${ch}" x="${x}" y="${y}" width="${w}" height="1"/>`;
        x += w;
      }
    });
    return out;
  }
  // Layers: the laptop and floor stay still; ACE breathes, blinks and types; the screen flickers; bits float up.
  const MASCOT_INNER = (() => {
    const pick = (set, swap = {}) => (c) => (swap[c] || (set.includes(c) ? c : null));
    const scene = pixelRects(MASCOT, pick("GSKQ"), null, "p");
    const screen = pixelRects(MASCOT, pick("P"), null, "p");
    const body = pixelRects(MASCOT, pick("DBLM", { E: "B", W: "B" }), null, "p");
    const eyes = pixelRects(MASCOT, pick("EW"), null, "p");
    const arm = pixelRects(MASCOT, pick("Rr"), null, "p");
    const bits = '<rect class="bit b1" x="22" y="16" width="1" height="1"/><rect class="bit b2" x="24" y="15" width="1" height="1"/><rect class="bit b3" x="21" y="15" width="1" height="1"/>';
    return `${scene}<g class="screen">${screen}</g><g class="bits">${bits}</g><g class="drop">${body}<g class="eyes">${eyes}</g><g class="arm">${arm}</g></g>`;
  })();
  // full scene (32x23), or just ACE's head and body for small spots like avatars

      "- Code blocks WITHOUT a file path appear only in the chat. Use them for short examples and explanations.",
      "WEB PROJECTS AND THE PREVIEW",
      "- Use index.html as the entry point. Link local files with relative paths: <link rel=\"stylesheet\" href=\"style.css\"> and <script src=\"app.js\"><\/script>. Use classic scripts; imports between local ES modules do not work.",
      "- The preview cannot make network requests (fetch or XHR to any server fails) and cannot load images from the internet, so make every graphic yourself (see ART AND SOUND) and use built-in sample data instead of APIs.",
      "- External libraries load only as <script src> tags from https://cdnjs.cloudflare.com, https://cdn.jsdelivr.net/npm/ or https://unpkg.com, pinned to an exact version. Google Fonts stylesheets work.",
      "- alert(), confirm() and prompt() don't show dialogs in the preview, so build any dialogs into the page. localStorage works but is cleared each time the preview reloads.",
      "- Other languages (Python, Java, C++ and so on) are welcome as files. The preview only runs web code, so say briefly how to run them on a computer.",
      "ART AND SOUND: MAKE YOUR OWN, NEVER EMOJI",
      "- Never use emoji as graphics, game pieces, characters or icons. Draw everything yourself.",
      "- Characters, enemies, items, tiles and effects are original pixel-art sprites you design. Put every sprite in sprites.js as `const SPRITES = {...};` where the object is strict JSON (double-quoted keys, no comments, no trailing commas). Shape (rows shortened here):\n" +
        '{ "hero": { "palette": { "k": "#1a1c2c", "b": "#3b5dc9", "l": "#73eff7", "w": "#f4f4f4" }, "frames": [ ["..kkkk..", ".kbbbbk.", "kblwwlbk"], ["..kkkk..", ".kbbbbk.", "kbwllwbk"] ], "fps": 6 } }',
      "- Each frame is an array of equal-length strings, one character per pixel. Each character is a one-character palette key and \".\" is transparent. Use sizes like 8x8, 16x16 or 24x24 (bigger for bosses). Give sprites a dark outline, 3-5 shades for depth, highlights, and 2-4 frame animations (idle, walk, jump, attack) whose frames clearly differ, so they look hand-made rather than like coloured blocks. Keep one consistent palette across the project.",
      "- Include this helper in sprites.js, use it to turn sprites into canvases, and drawImage them with ctx.imageSmoothingEnabled = false:\n" +
        "function spriteFrames(name, scale) {\n  const s = SPRITES[name];\n  return s.frames.map((rows) => {\n    const c = document.createElement(\"canvas\");\n    c.width = rows[0].length * scale; c.height = rows.length * scale;\n    const g = c.getContext(\"2d\");\n    rows.forEach((row, y) => [...row].forEach((ch, x) => {\n      if (ch !== \".\" && s.palette[ch]) { g.fillStyle = s.palette[ch]; g.fillRect(x * scale, y * scale, scale, scale); }\n    }));\n    return c;\n  });\n}",
      "- Load sprites.js before your game script. ACE Studio shows every sprite in SPRITES, animated, in its Sprites tab, so keep them all in that one object.",
      "- Backgrounds and UI: tiles from SPRITES, canvas drawing, CSS, or inline SVG you draw yourself.",
      "- Sound: synthesize effects and music with the Web Audio API (oscillators, noise buffers, envelopes) for a chiptune feel. Never load audio files. Start audio after the first click or key press.",
      "STYLE",
      "- Build polished, modern, responsive projects that work on the first run. For anything beyond a tiny demo, split the code into index.html, style.css and app.js (plus sprites.js when there is art).",
      "- Games: a <canvas> with a requestAnimationFrame loop and delta time; keyboard controls plus on-screen touch buttons on phones; a title screen, score, lives or health, game over and restart; pause with P or Escape; pixel art scaled by whole numbers with smoothing off; and good game feel (particles, screen shake, hit flashes, satisfying sounds).",
      "- Before the files, write at most one short sentence. After the files, give a brief summary (2-5 bullets) of what you built and how to use it. Don't repeat the code in prose.",
      "- When asked to fix errors, find the root cause and rewrite the affected files in full.",
      "- For questions that need no files, just answer normally.",
      filesBlock(chat.files),
      "The conversation follows.",
    ].join("\n\n");
  }
  // Sends the whole conversation. Only if it would pass the platform's size limit does it drop the
  // oldest messages (never the project files or the latest message). Returns null if even that is not enough.
  function buildInput(chat) {
    const turns = chat.turns;
    const last = turns[turns.length - 1];
    const msgs = turns.map((t) => ({
      role: t.role,
      content: t.role === "user"
        ? (t.content || "(see the attached image)") + (t.imageCount && t !== last ? `\n[${t.imageCount} image(s) were attached earlier]` : "")
        : historyText(t),
    }));
    const rules = { role: "user", content: rulesText(chat) };
    const size = (from) => bytesOf(rules.content) + msgs.slice(from).reduce((n, m) => n + bytesOf(m.content), 0);
    let start = 0;
    while (start < msgs.length - 1 && size(start) > maxPromptBytes) start++;
    while (start < msgs.length && msgs[start].role !== "user") start++;
    if (size(start) > maxPromptBytes) return null;
    return { input: [rules, ...msgs.slice(start)], trimmed: start > 0 };
  }
  function makeTitle(chat) {
    const first = chat.turns.find((t) => t.role === "user");
    const base = (first?.content || "Image project").replace(/\s+/g, " ").trim();
    return base.length > 42 ? base.slice(0, 40) + "…" : base;
  }

  async function send() {
    if (sampleState !== "ready" || ctl) return;
    const text = els.input.value.trim();
    if (!text && pendingImages.length === 0) return;
    if (!current()) createChat();
    const chat = current();
    const images = pendingImages.map((p) => p.blob);
    const turn = { role: "user", content: text };
    if (images.length) turn.imageCount = images.length;
    chat.turns.push(turn);
    if (images.length) imageUrls.set(chat.id + ":" + (chat.turns.length - 1), pendingImages.map((p) => p.url));
    pendingImages = []; renderAttachments();
    if (!chat.title || chat.turns.filter((t) => t.role === "user").length === 1) chat.title = makeTitle(chat);
    chat.updated = Date.now(); persist();
    els.input.value = ""; autosize();
    renderChatList(); renderThread();
    await respond(chat, images);
  }
  async function regenerate() {
    const chat = current();
    if (!chat || ctl) return;
    if (chat.undo) { chat.files = chat.undo; chat.undo = null; }
    if (chat.turns.at(-1)?.role === "assistant") chat.turns.pop();
    persist(); renderThread(); renderFiles(); previewStale = true;
    await respond(chat, []);
  }

  async function respond(chat, images) {
    const built = buildInput(chat);
    if (!built) { flash(ERR.prompt_too_large, 9000); return; }
    if (built.trimmed) flash("Older chat was left out to fit one message. Your project files were all sent.", 6000);
    const { m, content } = aiNode();
    content.innerHTML = THINKING;
    m.classList.add("busy");
    els.thread.append(m); scrollToEnd();
    const before = { ...chat.files };
    ctl = new AbortController(); setSendMode(true); renderConsole();
    let note = "", finalText = "", ok = false, shownWork = false, lastWriting = null;
    renderFileTabs(); loadEditor();
    try {
      const opts = {
        cache: false, signal: ctl.signal, modelTier: settings.tier,
        onText: ({ text }) => {
          const stick = nearBottom();
          const parsed = splitFiles(text);
          renderAI(content, text, true, parsed);
          if (parsed.files.length || parsed.deletes.length) {
            const keysBefore = Object.keys(chat.files).join("|");
            chat.files = composeFiles(before, parsed, true);
            previewStale = true;
            if (currentId === chat.id) {
              const writing = parsed.files.filter((f) => !f.done).at(-1) || parsed.files.at(-1);
              if (!shownWork && writing) { shownWork = true; if (isDesktop()) setWorkTab("code"); }
              if (writing && writing.path !== lastWriting) { lastWriting = writing.path; activePath = writing.path; chat.active = writing.path; renderFileTabs(); loadEditor(true); }
              else if (Object.keys(chat.files).join("|") !== keysBefore) { renderFileTabs(); loadEditor(true); }
              else if (writing && writing.path === activePath && !writing.done) loadEditor(true);
            }
          }
          if (stick) scrollToEnd();
        },
      };
      if (images.length) opts.images = images;
      const res = await sample(built.input, opts);
      finalText = res.text; ok = true;
      if (res.truncated) note = "The reply was cut short, so the last file may be unfinished. Ask ACE to continue.";
    } catch (e) {
      finalText = e?.text || "";
      if (e?.code === "cancelled") note = finalText ? "Stopped. Unfinished files were not saved." : "";
      else if (PERMANENT.has(e?.code)) { note = ERR[e.code] || "Claude isn't available here."; disableChat(note); }
      else note = ERR[e?.code] || ERR.upstream_error;
      if (e?.code === "refused") finalText = "";
    } finally {
      ctl = null; setSendMode(false);
    }
    const parsed = splitFiles(finalText);
    chat.files = composeFiles(before, parsed, ok);
    const changed = JSON.stringify(chat.files) !== JSON.stringify(before);
    chat.undo = changed ? before : null;
    if (finalText) chat.turns.push(note ? { role: "assistant", content: finalText, note } : { role: "assistant", content: finalText });
    chat.updated = Date.now(); persist();
    renderThread(); renderChatList();
    if (currentId === chat.id) {
      renderFiles(); previewStale = true;
      if (changed && buildPreview(chat.files)) {
        if (isDesktop()) setWorkTab("preview");
        else { runPreview(); flash("Preview ready"); }
      } else if (workTab === "preview") runPreview();
      renderConsole();
      if (!finalText && note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; els.thread.append(n); scrollToEnd(); }
    }
    if (isDesktop()) els.input.focus();
  }
  function disableChat(msg) { sampleState = "off"; els.unavailable.hidden = false; els.unavailable.textContent = msg; updateSend(); renderConsole(); }

  // ---------- settings ----------
  function openSheet() { els.setName.value = settings.name; els.setPersona.value = settings.persona; els.sheet.hidden = false; els.sheetBackdrop.hidden = false; els.setName.focus(); closeRail(); }
  function closeSheet() { els.sheet.hidden = true; els.sheetBackdrop.hidden = true; }
  $("openSettings").onclick = openSheet;
  $("cancelSettings").onclick = closeSheet;
  els.sheetBackdrop.onclick = closeSheet;
  $("resetSettings").onclick = () => { els.setName.value = DEFAULT_NAME; els.setPersona.value = DEFAULT_PERSONA; };
  $("saveSettings").onclick = () => {
    settings.name = els.setName.value.trim() || DEFAULT_NAME;
    settings.persona = els.setPersona.value.trim() || DEFAULT_PERSONA;
    saveSettings(); applyBrand(); renderThread(); closeSheet();
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!els.sheet.hidden) closeSheet(); closeRail(); } });

  // ---------- drawer ----------
  function closeRail() { els.rail.classList.remove("open"); }
  for (const b of document.querySelectorAll("[data-menu]")) b.onclick = (e) => { e.stopPropagation(); els.rail.classList.toggle("open"); };
  document.addEventListener("click", (e) => { if (els.rail.classList.contains("open") && !els.rail.contains(e.target) && !e.target.closest("[data-menu]")) closeRail(); });

  // ---------- boot ----------
  chats = chats.filter((c) => hasContent(c) || c.id === currentId);
  if (!chats.find((c) => c.id === currentId)) currentId = [...chats].sort((a, b) => b.updated - a.updated)[0]?.id || null;
  activePath = current()?.active || null;
  paintPixelArt(); applyBrand(); setWorkTab("code"); route(); autosize(); renderConsole();
  els.status.textContent = "Connecting to Claude…";

  (async () => {
    const use = (name) => (window.claude ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
    [sample, downloads] = await Promise.all([use("sample"), use("downloads")]);
    els.dlBtn.hidden = !downloads || !window.JSZip;
    if (!sample) {
      disableChat("ACE can build when this page is opened on claude.ai while signed in to Claude. The editor and preview still work.");
      els.status.textContent = "Not connected to Claude.";
      return;
    }
    sampleState = "ready";
    els.status.textContent = "Saved in this browser";
    try { const lim = await sample.limits(); imagesAllowed = !!lim?.images; if (lim?.maxPromptBytes) maxPromptBytes = lim.maxPromptBytes; if (lim?.images?.maxCount) imageMax = lim.images.maxCount; } catch { imagesAllowed = false; }
    els.attachBtn.hidden = !imagesAllowed;
    updateSend(); renderConsole();
  })();
})();
</script>
