<title>Kite Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: one-screen app. Chat list rail on the left (drawer on phones), conversation column, composer docked at the bottom. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --rail: #e8ecf0;
  --fg: #16202a;
  --muted: #5b6875;
  --line: #d5dce3;
  --accent: #0d6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #d6ecea;
  --user-bubble: #16202a;
  --user-ink: #f3f5f7;
  --code-bg: #eef1f4;
  --danger: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --panel: #151d25; --rail: #121a21; --fg: #e4eaf0; --muted: #93a1ae;
    --line: #26323d; --accent: #3fb8ae; --accent-ink: #062120; --accent-soft: #163634;
    --user-bubble: #e4eaf0; --user-ink: #0f151b; --code-bg: #0b1116; --danger: #f2867e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #151d25; --rail: #121a21; --fg: #e4eaf0; --muted: #93a1ae;
  --line: #26323d; --accent: #3fb8ae; --accent-ink: #062120; --accent-soft: #163634;
  --user-bubble: #e4eaf0; --user-ink: #0f151b; --code-bg: #0b1116; --danger: #f2867e;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; }

/* Rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; padding-block: 16px; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { flex: none; }
.new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 10px; padding: 9px 12px; font-weight: 600; }
.new-chat:hover { border-color: var(--accent); }
.rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; flex: 1; }
.chat-item { display: flex; align-items: center; border-radius: 8px; }
.chat-item button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.chat-item:hover { background: var(--panel); }
.chat-item.active { background: var(--accent-soft); }
.chat-item .del { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 6px; opacity: 0; }
.chat-item:hover .del, .chat-item.active .del, .chat-item .del:focus-visible { opacity: 1; }
.chat-item .del:hover { color: var(--danger); }
.rail-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.rail-foot button { text-align: left; background: none; border: 0; padding: 7px 4px; color: var(--muted); display: flex; gap: 8px; align-items: center; border-radius: 6px; }
.rail-foot button:hover { color: var(--fg); }

/* Main */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.chat-title { font-family: var(--font-display); font-weight: 500; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { display: flex; background: var(--rail); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.mode button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.scroller { flex: 1; overflow-y: auto; min-height: 0; }
.thread { max-width: 760px; margin: 0 auto; padding-block: 28px 20px; display: flex; flex-direction: column; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user { align-items: flex-end; }
.msg.user .bubble { background: var(--user-bubble); color: var(--user-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 85%;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.msg.user .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.msg.user .thumbs .gone { font-size: 12px; color: var(--muted); }
.msg.ai { align-items: stretch; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.who .dot { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.content { min-width: 0; overflow-wrap: anywhere; }
.content > :first-child { margin-top: 0; }
.content > :last-child { margin-bottom: 0; }
.content p { margin: 0 0 .8em; }
.content h1, .content h2, .content h3 { font-family: var(--font-display); line-height: 1.25; margin: 1.1em 0 .45em; text-wrap: balance; }
.content h1 { font-size: 1.35em; } .content h2 { font-size: 1.2em; } .content h3 { font-size: 1.05em; }
.content ul, .content ol { padding-left: 1.4em; margin: 0 0 .8em; }
.content li { margin: .2em 0; }
.content a { color: var(--accent); }
.content code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 5px; }
.content pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .9em; }
.content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
.content blockquote { margin: 0 0 .8em; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.content table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 .9em; font-size: 14px; }
.content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.thinking { color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
.msg-actions { display: flex; gap: 4px; }
.msg-actions button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 6px; }
.msg-actions button:hover { background: var(--rail); color: var(--fg); }
.note { font-size: 13px; color: var(--danger); }

/* Welcome */
.welcome { padding-top: 6vh; display: flex; flex-direction: column; gap: 18px; }
.welcome h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 52ch; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.starters button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.starters button:hover { border-color: var(--accent); }
.starters b { font-weight: 600; font-size: 14px; }
.starters span { color: var(--muted); font-size: 13px; }

/* Composer */
.composer-wrap { padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.composer { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 2px 10px rgba(16, 32, 42, .06); }
.composer:focus-within { border-color: var(--accent); }
.attachments { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 4px 0; }
.attachments .att { position: relative; }
.attachments img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.attachments .att button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); font-size: 12px; line-height: 20px; padding: 0; }
.composer textarea { border: 0; background: none; resize: none; outline: none; padding: 6px 8px; min-height: 26px; max-height: 220px; line-height: 1.5; }
.composer-row { display: flex; align-items: center; gap: 6px; }
.icon-btn { background: none; border: 0; color: var(--muted); padding: 7px; border-radius: 8px; display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); background: var(--rail); }
.hint { flex: 1; font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--fg); color: var(--bg); }
.status { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

/* Settings panel */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(8, 14, 20, .45); z-index: 30; }
.sheet { position: fixed; z-index: 31; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.sheet label { font-weight: 600; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.sheet label small { font-weight: 400; color: var(--muted); }
.sheet input, .sheet textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; font-weight: 400; }
.sheet textarea { min-height: 120px; resize: vertical; }
.sheet .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.unavailable { max-width: 760px; margin: 0 auto 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); }

.drop-overlay { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 22px; color: var(--fg); pointer-events: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(290px, 84vw); transform: translateX(-102%); transition: transform .2s ease;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .rail.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .menu-btn { display: grid; place-items: center; }
  .starters { grid-template-columns: minmax(0, 1fr); }
  .mode button { padding: 5px 9px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <aside class="rail" id="rail" aria-label="Chats">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 1 L24 11 L13 25 L2 11 Z" fill="var(--accent)"/><path d="M13 1 L13 25 M2 11 L24 11" stroke="var(--panel)" stroke-width="1.6" fill="none"/></svg>
      <span id="brandName">Kite</span>
    </div>
    <button class="new-chat" id="newChat" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>
    <div class="rail-label">Recent</div>
    <ul class="chat-list" id="chatList"></ul>
    <div class="rail-foot">
      <button type="button" id="openSettings">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15M3 3l1.6 1.6M11.4 11.4L13 13M3 13l1.6-1.6M11.4 4.6L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Customize assistant
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Show chats">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="chat-title" id="chatTitle">New chat</div>
      <div class="mode" role="group" aria-label="Response mode">
        <button type="button" data-tier="quick" aria-pressed="false" title="Fastest replies">Fast</button>
        <button type="button" data-tier="default" aria-pressed="true" title="Balanced quality and speed">Smart</button>
        <button type="button" data-tier="complex" aria-pressed="false" title="Most capable, thinks longest">Deep</button>
      </div>
    </header>

    <div class="scroller" id="scroller">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="unavailable" id="unavailable" hidden></div>
      <form class="composer" id="composer">
        <div class="attachments" id="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="Message Kite…" aria-label="Message"></textarea>
        <div class="composer-row">
          <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach image" title="Attach image" hidden>
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M15 8.5l-6.3 6.3a4 4 0 01-5.7-5.7L9.6 2.5a2.7 2.7 0 013.8 3.8L7 12.7a1.3 1.3 0 01-1.9-1.9L11 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button type="submit" class="send" id="sendBtn" disabled>Send
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <div class="status" id="status">Replies use your own Claude account. Chats are saved in this browser only.</div>
    </div>
  </main>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <h2 id="sheetTitle">Customize assistant</h2>
  <label for="setName">Assistant name
    <input id="setName" type="text" maxlength="40">
  </label>
  <label for="setPersona">Instructions
    <small>How it should behave: tone, expertise, what to focus on. Sent with every message.</small>
    <textarea id="setPersona"></textarea>
  </label>
  <div class="row">
    <button type="button" class="btn" id="resetSettings">Reset to default</button>
    <button type="button" class="btn" id="cancelSettings">Cancel</button>
    <button type="button" class="btn primary" id="saveSettings">Save</button>
  </div>
</div>
<div class="drop-overlay" id="dropOverlay" hidden>Drop images to attach</div>

<script>
(() => {
  const DEFAULT_NAME = "Kite";
  const DEFAULT_PERSONA = "You are a sharp, friendly, genuinely useful assistant. Give direct answers first, then detail if it helps. Use Markdown (headings, lists, code blocks) when it makes things clearer. Be honest when you are unsure.";
  const STARTERS = [
    ["Plan my week", "Help me plan a productive week: I work 9-5 and want to fit in gym 3x and learning a new skill."],
    ["Write an email", "Write a short, polite email asking my landlord to fix a leaking tap this week."],
    ["Explain something", "Explain how the stock market works like I'm a smart 15-year-old."],
    ["Fix my code", "Here's a Python function that should return the largest number in a list but crashes on an empty list. Fix it:\n\ndef biggest(nums):\n    best = nums[0]\n    for n in nums:\n        if n > best:\n            best = n\n    return best"],
  ];
  const MAX_TURNS = 40;

  const $ = (id) => document.getElementById(id);
  const els = {
    rail: $("rail"), chatList: $("chatList"), newChat: $("newChat"), thread: $("thread"), scroller: $("scroller"),
    input: $("input"), composer: $("composer"), sendBtn: $("sendBtn"), chatTitle: $("chatTitle"), menuBtn: $("menuBtn"),
    attachBtn: $("attachBtn"), fileInput: $("fileInput"), attachments: $("attachments"), status: $("status"),
    unavailable: $("unavailable"), brandName: $("brandName"), dropOverlay: $("dropOverlay"),
    sheet: $("sheet"), sheetBackdrop: $("sheetBackdrop"), setName: $("setName"), setPersona: $("setPersona"),
  };

  // ---------- storage (per-viewer, best effort) ----------
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let settings = store.get("kite.settings", { name: DEFAULT_NAME, persona: DEFAULT_PERSONA, tier: "default" });
  let chats = store.get("kite.chats", []);          // [{id, title, updated, turns:[{role, content, images?}]}]
  let currentId = store.get("kite.current", null);
  const saveChats = () => store.set("kite.chats", chats);
  const saveSettings = () => store.set("kite.settings", settings);
  const current = () => chats.find((c) => c.id === currentId) || null;

  // ---------- state ----------
  let sample = null;
  let sampleState = "loading"; // loading | ready | off
  let pendingImages = [];      // [{blob, url}]
  let ctl = null;              // AbortController of the running call
  let imagesAllowed = false;
  const imageUrls = new Map(); // message key -> object URLs (in memory only)

  const hasMd = typeof window.marked !== "undefined" && typeof window.DOMPurify !== "undefined";
  if (hasMd) marked.setOptions({ breaks: true, gfm: true });
  const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  const md = (text) => hasMd
    ? DOMPurify.sanitize(marked.parse(text || ""), { ADD_ATTR: ["target"] })
    : "<p>" + esc(text || "").replace(/\n/g, "<br>") + "</p>";

  // ---------- rendering ----------
  function renderChatList() {
    els.chatList.textContent = "";
    const sorted = [...chats].sort((a, b) => b.updated - a.updated);
    for (const c of sorted) {
      const li = document.createElement("li");
      li.className = "chat-item" + (c.id === currentId ? " active" : "");
      const open = document.createElement("button");
      open.type = "button"; open.className = "open"; open.textContent = c.title || "New chat";
      open.onclick = () => { switchChat(c.id); closeRail(); };
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.setAttribute("aria-label", "Delete chat"); del.textContent = "✕";
      del.onclick = () => deleteChat(c.id, del);
      li.append(open, del);
      els.chatList.append(li);
    }
  }

  function renderWelcome() {
    const w = document.createElement("div");
    w.className = "welcome";
    const h = document.createElement("h1");
    h.textContent = "What can I help with?";
    const p = document.createElement("p");
    p.textContent = `${settings.name} is your AI assistant, powered by Claude. Ask anything, attach images, or pick a starting point.`;
    const grid = document.createElement("div");
    grid.className = "starters";
    for (const [label, prompt] of STARTERS) {
      const b = document.createElement("button");
      b.type = "button";
      const t = document.createElement("b"); t.textContent = label;
      const s = document.createElement("span"); s.textContent = prompt.split("\n")[0].slice(0, 70) + (prompt.length > 70 ? "…" : "");
      b.append(t, s);
      b.onclick = () => { els.input.value = prompt; autosize(); updateSend(); els.input.focus(); };
      grid.append(b);
    }
    w.append(h, p, grid);
    els.thread.append(w);
  }

  function userNode(turn, key) {
    const m = document.createElement("div");
    m.className = "msg user";
    if (turn.imageCount) {
      const th = document.createElement("div"); th.className = "thumbs";
      const urls = imageUrls.get(key);
      if (urls) for (const u of urls) { const i = document.createElement("img"); i.src = u; i.alt = "Attached image"; th.append(i); }
      else { const g = document.createElement("span"); g.className = "gone"; g.textContent = `${turn.imageCount} image${turn.imageCount > 1 ? "s" : ""} attached`; th.append(g); }
      m.append(th);
    }
    if (turn.content) { const b = document.createElement("div"); b.className = "bubble"; b.textContent = turn.content; m.append(b); }
    return m;
  }

  function aiNode() {
    const m = document.createElement("div");
    m.className = "msg ai";
    const who = document.createElement("div"); who.className = "who";
    who.innerHTML = '<span class="dot"><svg width="10" height="10" viewBox="0 0 26 26"><path d="M13 1 L24 11 L13 25 L2 11 Z" fill="var(--accent-ink)"/></svg></span>';
    who.append(document.createTextNode(settings.name));
    const content = document.createElement("div"); content.className = "content";
    m.append(who, content);
    return { m, content };
  }

  function addActions(m, text, isLast) {
    const row = document.createElement("div"); row.className = "msg-actions";
    const copy = document.createElement("button"); copy.type = "button"; copy.textContent = "Copy";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; }
      catch { const r = document.createRange(); r.selectNodeContents(m.querySelector(".content")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Selected — press Ctrl+C"; }
      setTimeout(() => (copy.textContent = "Copy"), 1800);
    };
    row.append(copy);
    if (isLast) {
      const regen = document.createElement("button"); regen.type = "button"; regen.textContent = "Regenerate";
      regen.onclick = () => regenerate();
      row.append(regen);
    }
    m.append(row);
  }

  function renderThread() {
    els.thread.textContent = "";
    const c = current();
    els.chatTitle.textContent = c?.title || "New chat";
    if (!c || c.turns.length === 0) { renderWelcome(); return; }
    c.turns.forEach((t, i) => {
      if (t.role === "user") els.thread.append(userNode(t, c.id + ":" + i));
      else {
        const { m, content } = aiNode();
        content.innerHTML = md(t.content);
        if (t.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = t.note; m.append(n); }
        addActions(m, t.content, i === c.turns.length - 1 && !ctl);
        els.thread.append(m);
      }
    });
    scrollToEnd();
  }

  const scrollToEnd = () => { els.scroller.scrollTop = els.scroller.scrollHeight; };
  const nearBottom = () => els.scroller.scrollHeight - els.scroller.scrollTop - els.scroller.clientHeight < 120;

  function applyBrand() {
    els.brandName.textContent = settings.name;
    els.input.placeholder = `Message ${settings.name}…`;
    for (const b of document.querySelectorAll(".mode button")) b.setAttribute("aria-pressed", String(b.dataset.tier === settings.tier));
  }

  // ---------- chats ----------
  function newChat() {
    if (ctl) return;
    const c = current();
    if (c && c.turns.length === 0) { renderThread(); els.input.focus(); return; }
    const chat = { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "", updated: Date.now(), turns: [] };
    chats.push(chat); currentId = chat.id; store.set("kite.current", currentId); saveChats();
    renderChatList(); renderThread(); els.input.focus();
  }
  function switchChat(id) {
    if (ctl) return;
    currentId = id; store.set("kite.current", id); renderChatList(); renderThread();
  }
  function deleteChat(id, btn) {
    if (btn.dataset.confirm !== "1") {          // two-step confirm inside the page
      btn.dataset.confirm = "1"; btn.textContent = "Delete?"; btn.style.opacity = 1; btn.style.color = "var(--danger)";
      setTimeout(() => { if (btn.isConnected) { btn.dataset.confirm = ""; btn.textContent = "✕"; btn.style.color = ""; btn.style.opacity = ""; } }, 2500);
      return;
    }
    if (ctl && id === currentId) ctl.abort();
    chats = chats.filter((c) => c.id !== id); saveChats();
    if (currentId === id) { currentId = chats.sort((a, b) => b.updated - a.updated)[0]?.id || null; store.set("kite.current", currentId); }
    renderChatList(); renderThread();
  }

  // ---------- composer ----------
  function autosize() { els.input.style.height = "auto"; els.input.style.height = Math.min(els.input.scrollHeight, 220) + "px"; }
  function updateSend() {
    if (ctl) { els.sendBtn.disabled = false; return; }
    els.sendBtn.disabled = sampleState !== "ready" || (!els.input.value.trim() && pendingImages.length === 0);
  }
  function setSendMode(running) {
    els.sendBtn.classList.toggle("stop", running);
    els.sendBtn.firstChild.textContent = running ? "Stop " : "Send ";
    updateSend();
  }
  function renderAttachments() {
    els.attachments.textContent = "";
    els.attachments.hidden = pendingImages.length === 0;
    pendingImages.forEach((p, i) => {
      const d = document.createElement("div"); d.className = "att";
      const img = document.createElement("img"); img.src = p.url; img.alt = "Image to send";
      const x = document.createElement("button"); x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Remove image");
      x.onclick = () => { URL.revokeObjectURL(p.url); pendingImages.splice(i, 1); renderAttachments(); updateSend(); };
      d.append(img, x); els.attachments.append(d);
    });
  }
  function addFiles(files) {
    if (!imagesAllowed) return;
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      if (pendingImages.length >= 5) break;
      pendingImages.push({ blob: f, url: URL.createObjectURL(f) });
    }
    renderAttachments(); updateSend();
  }

  els.input.addEventListener("input", () => { autosize(); updateSend(); });
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!els.sendBtn.disabled && !ctl) send(); }
  });
  els.input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (files.length && imagesAllowed) { e.preventDefault(); addFiles(files); }
  });
  els.composer.addEventListener("submit", (e) => { e.preventDefault(); if (ctl) ctl.abort(); else send(); });
  els.attachBtn.onclick = () => els.fileInput.click();
  els.fileInput.onchange = () => { addFiles(els.fileInput.files); els.fileInput.value = ""; };
  let dragDepth = 0;
  document.addEventListener("dragenter", (e) => { if (imagesAllowed && e.dataTransfer?.types?.includes("Files")) { dragDepth++; els.dropOverlay.hidden = false; } });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; els.dropOverlay.hidden = true; } });
  document.addEventListener("dragover", (e) => { if (imagesAllowed) e.preventDefault(); });
  document.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; els.dropOverlay.hidden = true; addFiles(e.dataTransfer?.files || []); });

  els.newChat.onclick = newChat;
  for (const b of document.querySelectorAll(".mode button")) b.onclick = () => { settings.tier = b.dataset.tier; saveSettings(); applyBrand(); };

  // ---------- talking to Claude ----------
  const ERR = {
    not_granted: "You haven't allowed this app to use Claude. Reload the page and choose Allow to chat.",
    sampling_disabled: "Claude isn't available on this account.",
    rate_limited: "You've hit a usage limit. Wait a little, then try again.",
    session_expired: "Your sign-in expired. Sign in to Claude again, then retry.",
    refused: "Claude declined that request. Try rephrasing it.",
    prompt_too_large: "This chat is too long. Start a new chat to keep going.",
    image_rejected: "One of the images couldn't be used. Try a JPEG or PNG under 20 MB.",
    empty_completion: "No reply came back. Try asking in a different way.",
    upstream_error: "The connection dropped. Press Regenerate to try again.",
  };
  const PERMANENT = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

  function buildInput(turns) {
    const rules = `${settings.persona.trim() || DEFAULT_PERSONA}\n\nYour name is ${settings.name}. Today is ${new Date().toDateString()}. The conversation follows.`;
    const recent = turns.slice(-MAX_TURNS);
    while (recent.length && recent[0].role !== "user") recent.shift();
    const msgs = recent.map((t) => ({
      role: t.role,
      content: t.role === "user"
        ? (t.content || "(see image)") + (t.imageCount && t !== turns[turns.length - 1] ? `\n[${t.imageCount} image(s) were attached earlier]` : "")
        : t.content,
    }));
    return [{ role: "user", content: rules }, ...msgs];
  }

  function makeTitle(chat) {
    const first = chat.turns.find((t) => t.role === "user");
    const base = (first?.content || "Image chat").replace(/\s+/g, " ").trim();
    return base.length > 42 ? base.slice(0, 40) + "…" : base;
  }

  async function send() {
    if (sampleState !== "ready" || ctl) return;
    const text = els.input.value.trim();
    if (!text && pendingImages.length === 0) return;
    let chat = current();
    if (!chat) { newChat(); chat = current(); }
    const images = pendingImages.map((p) => p.blob);
    const turn = { role: "user", content: text };
    if (images.length) turn.imageCount = images.length;
    chat.turns.push(turn);
    if (images.length) imageUrls.set(chat.id + ":" + (chat.turns.length - 1), pendingImages.map((p) => p.url));
    pendingImages = []; renderAttachments();
    if (!chat.title) chat.title = makeTitle(chat);
    chat.updated = Date.now(); saveChats();
    els.input.value = ""; autosize();
    renderChatList(); renderThread();
    await respond(chat, images);
  }

  async function regenerate() {
    const chat = current();
    if (!chat || ctl) return;
    if (chat.turns.at(-1)?.role === "assistant") chat.turns.pop();
    saveChats(); renderThread();
    await respond(chat, []);
  }

  async function respond(chat, images) {
    const { m, content } = aiNode();
    content.innerHTML = '<span class="thinking"><i></i><i></i><i></i> Thinking</span>';
    els.thread.append(m); scrollToEnd();
    ctl = new AbortController(); setSendMode(true);
    let note = "";
    let finalText = "";
    try {
      const opts = { cache: false, signal: ctl.signal, modelTier: settings.tier,
        onText: ({ text }) => { const stick = nearBottom(); content.innerHTML = md(text); if (stick) scrollToEnd(); } };
      if (images.length) opts.images = images;
      const res = await sample(buildInput(chat.turns), opts);
      finalText = res.text;
      if (res.truncated) note = "The reply was cut short. Ask it to continue.";
    } catch (e) {
      finalText = e?.text || "";
      if (e?.code === "cancelled") note = finalText ? "Stopped." : "";
      else if (PERMANENT.has(e?.code)) { disableChat(ERR[e.code] || "Claude isn't available in this view."); note = ERR[e.code] || ""; }
      else note = ERR[e?.code] || ERR.upstream_error;
      if (e?.code === "refused") finalText = "";
    } finally {
      ctl = null; setSendMode(false);
    }
    if (finalText) chat.turns.push(note ? { role: "assistant", content: finalText, note } : { role: "assistant", content: finalText });
    chat.updated = Date.now(); saveChats();
    if (currentId === chat.id) {
      renderThread();
      if (!finalText && note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; els.thread.append(n); scrollToEnd(); }
    }
    renderChatList();
    els.input.focus();
  }

  function disableChat(msg) {
    sampleState = "off"; els.unavailable.hidden = false; els.unavailable.textContent = msg; updateSend();
  }

  // ---------- settings sheet ----------
  function openSheet() { els.setName.value = settings.name; els.setPersona.value = settings.persona; els.sheet.hidden = false; els.sheetBackdrop.hidden = false; els.setName.focus(); closeRail(); }
  function closeSheet() { els.sheet.hidden = true; els.sheetBackdrop.hidden = true; }
  $("openSettings").onclick = openSheet;
  $("cancelSettings").onclick = closeSheet;
  els.sheetBackdrop.onclick = closeSheet;
  $("resetSettings").onclick = () => { els.setName.value = DEFAULT_NAME; els.setPersona.value = DEFAULT_PERSONA; };
  $("saveSettings").onclick = () => {
    settings.name = els.setName.value.trim() || DEFAULT_NAME;
    settings.persona = els.setPersona.value.trim() || DEFAULT_PERSONA;
    saveSettings(); applyBrand(); renderThread(); closeSheet();
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!els.sheet.hidden) closeSheet(); closeRail(); } });

  // ---------- mobile drawer ----------
  function closeRail() { els.rail.classList.remove("open"); }
  els.menuBtn.onclick = (e) => { e.stopPropagation(); els.rail.classList.toggle("open"); };
  document.addEventListener("click", (e) => { if (els.rail.classList.contains("open") && !els.rail.contains(e.target) && e.target !== els.menuBtn) closeRail(); });

  // ---------- boot ----------
  if (!chats.find((c) => c.id === currentId)) currentId = chats.sort((a, b) => b.updated - a.updated)[0]?.id || null;
  applyBrand(); renderChatList(); renderThread(); autosize();
  els.status.textContent = "Connecting to Claude…";

  (async () => {
    try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
    if (!sample) {
      disableChat("Chat works when this page is opened on claude.ai, signed in to Claude.");
      els.status.textContent = "Not connected to Claude.";
      return;
    }
    sampleState = "ready";
    els.status.textContent = "Replies use your own Claude account. Chats are saved in this browser only.";
    try { const lim = await sample.limits(); imagesAllowed = !!lim?.images; } catch { imagesAllowed = false; }
    els.attachBtn.hidden = !imagesAllowed;
    updateSend();
  })();
})();
</script>
